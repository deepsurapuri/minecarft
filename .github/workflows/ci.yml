name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # raknet-native can't build without cmake in CI — jsp-raknet is used at runtime instead.
      - run: npm ci --ignore-scripts
      - run: npm test
